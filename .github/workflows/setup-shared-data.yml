name: Setup DIPS shared data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/setup-shared-data.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test setup workflow
        run: echo "DIPS setup workflow is available"
