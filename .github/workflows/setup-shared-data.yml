name: Setup DIPS shared data

on:
  push:
    branches:
      - main
    paths:
      - scripts/setup_shared_data.py
      - .github/workflows/setup-shared-data.yml

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate embedded data to shared JSON
        run: python scripts/setup_shared_data.py

      - name: Commit generated shared data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/companies.json data/approved_events.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Connect DIPS website to shared Approved Event DB"
            git push origin main
          fi
