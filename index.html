<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIPS 참여기업 현황</title><style>
:root{--red:#C8102E;--bg:#FCFAF7;--line:#E5DCD5;--text:#161616;--muted:#716A64;--pill:#FFF7F6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.5}
.wrap{max-width:1488px;margin:0 auto;padding:0 24px 74px}
header{display:flex;justify-content:space-between;align-items:center;padding:38px 20px 25px;border-bottom:3px solid var(--red)}
.kicker{font-size:12px;color:#777;letter-spacing:.06em}h1{font-size:34px;margin:5px 0 4px}.sub{font-size:13px;color:#777}
.logo{width:184px;height:auto;object-fit:contain}
.toolbar{margin-top:18px;border:1px solid var(--line);padding:18px;display:grid;grid-template-columns:1.25fr .96fr .96fr .96fr .96fr;gap:10px;background:#fff}
.toolbar input,.toolbar select{width:100%;height:44px;border:1px solid #CEC3BA;background:#fff;padding:0 13px;font-size:13px;color:#222}
.tabs{display:flex;gap:8px;margin:20px 0 12px}.tab{border:1px solid #D8CCC4;background:#fff;color:#222;padding:11px 15px;font-size:13px;cursor:pointer}
.tab.active{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.company-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.company-card{background:#fff;border:1px solid var(--line);padding:20px;min-height:232px;overflow:visible}
.company-name{font-size:19px;font-weight:800;white-space:nowrap;word-break:keep-all;overflow:visible;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.pill{display:inline-block;border:1px solid #E7C5C8;background:var(--pill);color:#9E3441;border-radius:999px;padding:3px 8px;font-size:11px;white-space:nowrap}
.product{font-size:13px;margin-bottom:8px;color:#2F2A26}.meta{font-size:12px;color:var(--muted);padding-bottom:13px;border-bottom:1px solid #E8DFD8}
.latest-label{font-size:12px;font-weight:800;margin-top:12px}.latest{font-size:12.5px;line-height:1.48;margin-top:2px;word-break:keep-all}
.timeline-view{display:none}.timeline-view.active{display:block}.company-view.hidden{display:none}
.timeline-list{background:#fff;border-top:1px solid var(--line)}
.timeline-row{display:grid;grid-template-columns:190px minmax(0,1fr) 112px;gap:20px;padding:18px 14px;border-bottom:1px solid var(--line);align-items:start;min-height:104px}
.timeline-left{min-width:190px}.timeline-year{font-size:16px;font-weight:800;color:var(--red);line-height:1.25;margin-bottom:6px}
.timeline-company{font-size:14px;font-weight:800;white-space:nowrap;word-break:keep-all;overflow:visible}
.timeline-main{min-width:0}.timeline-text{font-size:15px;line-height:1.45;color:#111;word-break:keep-all}
.timeline-tag{display:inline-block;margin-top:9px;border:1px solid #E7C5C8;background:#FFF8F7;color:#9E3441;border-radius:999px;padding:3px 8px;font-size:10.5px}
.timeline-source{text-align:left;padding-top:2px;white-space:nowrap}.timeline-source a{color:var(--red);font-size:11px;font-weight:700;text-decoration:none}
.timeline-source .no-proof{color:#8A837D;font-size:11px;font-weight:600}
.unsourced-divider{padding:16px 14px 8px;color:#706963;font-size:12px;font-weight:700;background:#F8F5F2;border-bottom:1px solid var(--line)}
.empty{background:#fff;border:1px solid var(--line);padding:36px;text-align:center;color:#777}
@media(max-width:1100px){
 .toolbar{grid-template-columns:1fr 1fr}.company-grid{grid-template-columns:repeat(2,minmax(330px,1fr))}
 .timeline-row{grid-template-columns:210px minmax(520px,1fr) 112px;min-width:900px}.timeline-list{overflow-x:auto}
}
</style></head>

function companyEvents(name){
  return events.filter(e=>e.company===name).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

function filteredEvents(){
  const q=$("q").value.trim().toLowerCase(), c=$("cat").value, s=$("stage").value, y=$("yearF").value, t=$("tagF").value;
  const allowed=new Set(companies.filter(x=>{
    const searchText=[x.name,x.product,x.category,x.subcat,x.location,x.rep].filter(Boolean).join(" ").toLowerCase();
    return (!q||searchText.includes(q))&&(!c||x.category===c)&&(!s||x.stage===s);
  }).map(x=>x.name));
  return events.filter(e=>allowed.has(e.company)&&(!y||e.year===y)&&(!t||e.tag===t));
}

  const q=$("q").value.trim().toLowerCase(), c=$("cat").value, s=$("stage").value, y=$("yearF").value, t=$("tagF").value;
  const arr=companies.filter(x=>{
    const searchText=[x.name,x.product,x.category,x.subcat,x.location,x.rep].filter(Boolean).join(" ").toLowerCase();
    const ev=companyEvents(x.name).filter(e=>(!y||e.year===y)&&(!t||e.tag===t));
    return (!q||searchText.includes(q))&&(!c||x.category===c)&&(!s||x.stage===s)&&((!y&&!t)||ev.length>0);
  });
  $("companyGrid").innerHTML=arr.length?arr.map(x=>{
    const evs=companyEvents(x.name).filter(e=>(!y||e.year===y)&&(!t||e.tag===t));
    const latest=evs[0]||companyEvents(x.name)[0];
    return `<article class="company-card">
      <div class="company-name">${x.name}</div>
      <div class="pills"><span class="pill">${x.category||"-"}</span><span class="pill">${x.subcat||"-"}</span><span class="pill">${x.stage||"-"}</span></div>
      <div class="product">${x.product||""}</div>
      <div class="meta">${x.location||"-"} · 선정 ${x.year||"-"}</div>
      <div class="latest-label">최근 성과</div>
      <div class="latest">${latest?latest.display_text:"성과 미등록"}</div>
    </article>`;
  }).join(""):`<div class="empty">조건에 해당하는 참여기업 없음</div>`;
}

function renderTimeline(){
  const arr=filteredEvents();
  const evidenced=arr.filter(e=>e.evidence);
  const unsourced=arr.filter(e=>!e.evidence);
  let html="";
  function row(e){
    const src=e.url?`<a href="${e.url}" target="_blank" rel="noopener">원문 보기 →</a>`:`<span class="no-proof">증빙 미등록</span>`;
    return `<div class="timeline-row">
      <div class="timeline-left"><div class="timeline-year">${e.year||"-"}</div><div class="timeline-company">${e.company}</div></div>
      <div class="timeline-main"><div class="timeline-text">${e.display_text||e.text}</div><span class="timeline-tag">${e.tag||"기타"}</span></div>
      <div class="timeline-source">${src}</div>
    </div>`;
  }
  html += evidenced.map(row).join("");
  if(unsourced.length){
    html += `<div class="unsourced-divider">증빙 링크가 등록되지 않은 성과</div>` + unsourced.map(row).join("");
  }
  $("timelineList").innerHTML=html||`<div class="empty">조건에 해당하는 성과 없음</div>`;
}

function refresh(){renderCompanies();renderTimeline();}
["q","cat","stage","yearF","tagF"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",refresh));

$("companyTab").addEventListener("click",()=>{
  $("companyTab").classList.add("active");$("timelineTab").classList.remove("active");
  $("companyView").classList.remove("hidden");$("timelineView").classList.remove("active");
});
$("timelineTab").addEventListener("click",()=>{
  $("timelineTab").classList.add("active");$("companyTab").classList.remove("active");
  $("companyView").classList.add("hidden");$("timelineView").classList.add("active");
});
refresh();
</script></body></html>
